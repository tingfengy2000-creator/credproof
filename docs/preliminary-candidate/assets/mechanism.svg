<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030"><rect width="100%" height="100%" fill="#f5f8fa"/>
<text x="52" y="69" font-family="Microsoft YaHei,sans-serif" font-size="39" font-weight="700" fill="#233f52">密证 CredProof——面向 AI 工具的凭据泄露验证与受控修复系统</text>
<text x="54" y="112" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#627c8d">本地模型生成候选 · 程序验收安全与业务 · 对应材料导出复检</text>
<rect x="52" y="156" width="428" height="213" rx="18" fill="white" stroke="#cbdde1" stroke-width="2"/>
<text x="76" y="194" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#087e78">01 / TRUSTED INPUT</text>
<text x="76" y="237" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#233f52">固定任务边界</text>
<text x="76" y="283" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">登记代码、允许修改范围</text>
<text x="76" y="317" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">可信需求与必要业务条件</text>
<text x="76" y="351" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">源码和工具输出均是不可信数据</text>
<rect x="536" y="156" width="428" height="213" rx="18" fill="white" stroke="#cbdde1" stroke-width="2"/>
<text x="560" y="194" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#087e78">02 / DETERMINISTIC</text>
<text x="560" y="237" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#233f52">先确认，再授权</text>
<text x="560" y="283" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">固定触发条件 + 隔离执行</text>
<text x="560" y="317" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">实际匹配禁止通道中的凭据</text>
<text x="560" y="351" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">当前证据不足 → 拒绝自动修改</text>
<rect x="1020" y="156" width="428" height="213" rx="18" fill="white" stroke="#cbdde1" stroke-width="2"/>
<text x="1044" y="194" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#087e78">03 / LOCAL MODEL</text>
<text x="1044" y="237" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#233f52">证据驱动候选生成</text>
<text x="1044" y="283" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">读取代码与脱敏运行观察</text>
<text x="1044" y="317" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">提出假设、触发与候选补丁</text>
<text x="1044" y="351" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">最多 12 次调用 / 3 份候选</text>
<path d="M480 264 L527 264" fill="none" stroke="#278a82" stroke-width="4"/>
<path d="M964 264 L1011 264" fill="none" stroke="#278a82" stroke-width="4"/>
<rect x="52" y="505" width="428" height="213" rx="18" fill="white" stroke="#cbdde1" stroke-width="2"/>
<text x="76" y="543" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#087e78">06 / RECHECK</text>
<text x="76" y="586" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#233f52">对应材料导出与复检</text>
<text x="76" y="632" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">原件、候选、规则、轨迹清单</text>
<text x="76" y="666" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">对象变化 → 重新核对与检查</text>
<text x="76" y="700" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">旧报告适用性 / 当前独立判决</text>
<rect x="536" y="505" width="428" height="213" rx="18" fill="white" stroke="#cbdde1" stroke-width="2"/>
<text x="560" y="543" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#087e78">05 / EXECUTOR</text>
<text x="560" y="586" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#233f52">判决与任务状态分离</text>
<text x="560" y="632" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">PASS / FAIL / UNKNOWN</text>
<text x="560" y="666" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">满足完成条件即结束任务</text>
<text x="560" y="700" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">保留拒绝、失败与预算耗尽</text>
<rect x="1020" y="505" width="428" height="213" rx="18" fill="white" stroke="#cbdde1" stroke-width="2"/>
<text x="1044" y="543" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#087e78">04 / SANDBOX</text>
<text x="1044" y="586" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#233f52">验收安全与业务行为</text>
<text x="1044" y="632" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">隔离运行候选副本</text>
<text x="1044" y="666" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">检查泄露、业务与修改边界</text>
<text x="1044" y="700" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#233f52">失败证据回传，模型可调整</text>
<path d="M1234 369 L1234 496" fill="none" stroke="#278a82" stroke-width="4"/>
<path d="M1012 613 h-44" stroke="#278a82" stroke-width="4"/>
<path d="M528 613 h-44" stroke="#278a82" stroke-width="4"/>
<path d="M1448 610 H1478 V264 H1450" fill="none" stroke="#278a82" stroke-width="3"/>
<path d="M1450 264 l12 -7 v14 z" fill="#278a82"/>
<text x="1040" y="453" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#087e78">失败后调整</text>
<rect x="52" y="769" width="1396" height="182" rx="16" fill="#173346"/>
<text x="80" y="813" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#ffffff">三个作品特点</text>
<text x="80" y="852" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#a9e2d6">证据驱动的候选生成与反馈调整</text>
<text x="80" y="891" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#a9e2d6">程序控制的修改权限与安全/业务验收</text>
<text x="80" y="930" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700" fill="#a9e2d6">对应修复对象的材料导出与复检</text>
<text x="54" y="1000" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#617b8c">工作台分别展示模型判断、程序确认与任务状态，保留候选差异和验证回执。</text>
</svg>