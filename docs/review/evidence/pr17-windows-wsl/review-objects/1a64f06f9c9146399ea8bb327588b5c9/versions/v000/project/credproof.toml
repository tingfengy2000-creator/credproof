# Generated by the CredProof workbench configuration wizard.
# Only the entry file may change during review; tests and this file are frozen.
schema = "credproof.project-safety/v1"

[project]
root = "."
tests = ["tests"]
optional_tests = []
source_scope = ["*.py", "**/*.py"]
mutable_scope = ["tool.py"]

[files]
allowed_dirs = ["data"]
forbidden_dirs = ["secrets"]
require_allowed_file_read = true

[network]
require_service_credential = true
allowed_services = [
  { scheme = "http", host = "127.0.0.1", port = 0, path_prefix = "/api" },
]

[credentials]
env = "REPORT_API_TOKEN"

[entry]
module = "tool"
callable = "fetch_report"
request = { path = "__CREDPROOF_ALLOWED_FILE__", url = "__CREDPROOF_ALLOWED_URL__" }

[[entry.scenarios]]
name = "normal_2"
request = { path = "__CREDPROOF_ALLOWED_FILE__", url = "__CREDPROOF_ALLOWED_URL__" }

[[entry.scenarios]]
name = "redirect_refused"
expected_error = "HTTPError"
require_network = true
request = { path = "__CREDPROOF_ALLOWED_FILE__", url = "__CREDPROOF_REDIRECT_URL__" }

[limits]
timeout_seconds = 30
report_dir = ".credproof"
