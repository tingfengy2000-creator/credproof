<script>
'use strict';
const $=s=>document.querySelector(s);
const icon=(id,size='')=>`<svg class="icon ${size}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=(text,color='gray')=>`<span class="pill ${color}">${text}</span>`;
const state={page:'overview',finding:'CP-001',source:'index',scenario:'pass',filter:'all',search:'',question:'为什么这项凭据仍需处置？'};
const findings=[
 {id:'CP-001',name:'服务访问令牌',type:'结构 Token',path:'src/config.py',line:18,level:'需要处置',tone:'amber',source:'暂存区 · 历史未检查',confidence:'结构匹配 + 赋值上下文',support:true},
 {id:'CP-002',name:'数据库连接配置',type:'带认证信息的 DSN',path:'config/database.json',line:7,level:'需要处置',tone:'amber',source:'工作区 · 暂存区',confidence:'连接串结构匹配',support:false},
 {id:'CP-003',name:'私钥结构片段',type:'PEM 私钥',path:'tests/fixtures/key_sample.pem',line:1,level:'待人工复核',tone:'blue',source:'工作区 · 测试夹具',confidence:'结构匹配；用途待复核',support:false}
];
const footer=()=>`<footer class="page-footer"><span>${icon('lock','i16')} 证据有范围，结论有边界。</span><span>本页所有状态均为交互示例 · 不代表实测结果</span></footer>`;
const heading=(k,title,desc,actions='')=>`<div class="page-heading"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p>${desc}</p></div><div class="heading-actions">${actions}</div></div>`;
const gotoBtn=(page,text,primary=false)=>`<button class="btn ${primary?'primary':''}" data-go="${page}">${text}${icon('arrow','i16')}</button>`;
function overview(){return heading('SECURITY WORKSPACE','风险处置总览','把发现、来源和副本验证，在同一处对齐。',`<button class="btn" data-modal="scope">${icon('branch','i16')} 查看示例范围</button>${gotoBtn('repair','查看最新验证',true)}`)+`
 <section class="stats" aria-label="示例任务概况">
  <div class="stat"><div class="stat-label">需要处置 ${icon('key','i16 stat-icon')}</div><div class="stat-value">2<span>项发现</span></div><div class="stat-meta"><span class="dot" style="background:#c6a262"></span> 原来源仍有暴露记录</div></div>
  <div class="stat"><div class="stat-label">来源视图 ${icon('branch','i16 stat-icon')}</div><div class="stat-value">3<span>独立范围</span></div><div class="stat-meta">工作区 / index / 有界历史</div></div>
  <div class="stat"><div class="stat-label">副本验证 ${icon('shield','i16 stat-icon')}</div><div class="stat-value word" style="color:${state.scenario==='pass'?'#267967':state.scenario==='fail'?'#ad6257':'#a3884d'}">${state.scenario==='pass'?'通过':state.scenario==='fail'?'未通过':'结论未知'}</div><div class="stat-meta"><span class="dot" style="background:${state.scenario==='pass'?'#56b4a6':state.scenario==='fail'?'#bf8075':'#c1a367'}"></span> 仅针对指定受控副本</div></div>
  <div class="stat"><div class="stat-label">凭据云端状态 ${icon('lock','i16 stat-icon')}</div><div class="stat-value word">未验证</div><div class="stat-meta">有效性与撤销均不作推断</div></div>
 </section>
 <div class="overview-grid"><section class="card"><div class="card-head"><div><h2>一次修复，四份状态</h2><p>CP-001 · 服务访问令牌 · 同值身份关联，来源分别判断</p></div>${pill('示例证据','gray')}</div><div class="state-story"><div class="state-track">
  <div class="state-cell"><div class="state-symbol">${icon('folder')}</div><div class="state-name">工作区</div><div class="state-label">范围内未发现</div><div class="tiny">本次工作区快照<br>不代表其他版本</div></div>
  <div class="state-cell warn"><div class="state-symbol">${icon('branch')}</div><div class="state-name">暂存区 / index</div><div class="state-label" style="color:#a9803e">仍然存在</div><div class="tiny">待提交的旧内容<br>原 index 尚未修改</div></div>
  <div class="state-cell"><div class="state-symbol">${icon('clock')}</div><div class="state-name">历史 / P0未执行</div><div class="state-label">尚未检查</div><div class="tiny">NOT_SCANNED<br>不推断是否出现</div></div>
  <div class="state-cell ${state.scenario==='pass'?'good':'warn'}"><div class="state-symbol">${icon(state.scenario==='pass'?'shield':state.scenario==='fail'?'alert':'info')}</div><div class="state-name">修复副本</div><div class="state-label" style="color:${state.scenario==='pass'?'#368a77':state.scenario==='fail'?'#ad6257':'#a3884d'}">${state.scenario==='pass'?'验证通过':state.scenario==='fail'?'验证未通过':'验证结论未知'}</div><div class="tiny">${state.scenario==='pass'?'index 导出的副本<br>没有写入原仓库':state.scenario==='fail'?'副本仍有同值残留<br>没有写入原仓库':'副本范围不完整<br>没有写入原仓库'}</div></div>
 </div><div class="story-caption">${icon('info','i16')}<div><strong>副本结论有边界，原来源独立判断。</strong><br>原 index 仍存在凭据；P0不扫描历史，未知状态不会被副本结论覆盖。</div></div></div></section>
 <section class="card"><div class="card-head"><div><h2>下一步，处理真正剩下的事</h2><p>按证据推进，不用一个绿灯代替结论</p></div></div><div class="task-list">
  <div class="task-row"><span class="task-num">01</span><div class="task-text"><strong>审阅副本与来源范围</strong><p>确认改写与验证义务，再自行决定应用。</p></div><button class="icon-button" data-go="repair" aria-label="查看副本验证">${icon('arrow','i16')}</button></div>
  <div class="task-row"><span class="task-num">02</span><div class="task-text"><strong>处理暂存区，保留历史未知</strong><p>P0不扫描历史，也不自动 git add。</p></div><button class="icon-button" data-source-link="index" aria-label="查看CP-001原暂存区证据">${icon('arrow','i16')}</button></div>
  <div class="task-row"><span class="task-num">03</span><div class="task-text"><strong>单独确认撤销与轮换</strong><p>离线检查无法证明凭据已经失效。</p></div><button class="icon-button" data-modal="rotation" aria-label="查看撤销与轮换说明">${icon('arrow','i16')}</button></div>
 </div><div class="task-foot"><button class="btn subtle slim" data-go="report">打开验证报告 ${icon('arrow','i16')}</button></div></section></div>
 <section class="card"><div class="card-head"><div><h2>处置队列</h2><p>从一条发现，进入完整证据链</p></div><button class="btn subtle slim" data-go="evidence">全部 3 项 ${icon('arrow','i16')}</button></div><div class="table-wrap"><table class="table"><thead><tr><th>发现 / 类型</th><th class="optional">证据位置</th><th>处置状态</th><th class="optional">来源</th><th><span class="sr-only">操作</span></th></tr></thead><tbody>${findings.map(f=>`<tr><td><div class="finding-name"><span class="finding-icon">${icon('key','i16')}</span><div><strong>${f.name}</strong><small>${f.id} · ${f.type}</small></div></div></td><td class="optional"><code>${f.path}:${f.line}</code></td><td>${pill(f.level,f.tone)}</td><td class="optional muted">${f.source}</td><td><button class="btn subtle slim" data-finding="${f.id}">查看 ${icon('arrow','i16')}</button></td></tr>`).join('')}</tbody></table></div><div class="section-foot"><span>3 条预置模拟发现 · 无真实凭据</span><span class="optional">强证据与待复核项分别呈现</span></div></section>${footer()}`;}
function findingItems(){let items=findings.filter(f=>(state.filter==='all'||(state.filter==='review'?f.tone==='blue':f.tone==='amber'))&&(f.name+f.path+f.id).toLowerCase().includes(state.search.toLowerCase()));return items.length?items.map(f=>`<button class="finding-item ${state.finding===f.id?'selected':''}" data-select="${f.id}" aria-pressed="${state.finding===f.id}"><div class="row"><span class="mono muted" style="font-size:9px">${f.id}</span>${pill(f.level,f.tone)}</div><strong>${f.name}</strong><code>${f.path}</code><div class="hint">${f.confidence}</div></button>`).join(''):'<div class="empty-search">没有匹配的模拟发现。</div>';}
function evidenceDetail(){const f=findings.find(x=>x.id===state.finding);const first=f.id==='CP-001';let status,tone,meaning,lines;
 if(state.source==='history'){status='NOT_SCANNED';tone='gray';meaning='P0不执行历史扫描 · 不推断存在或不存在';lines=[];}
 else if(first&&state.source==='worktree'){status='ABSENT_WITHIN_SCOPE';tone='green';meaning='范围内未发现 · 示例快照完整';lines=[['16','# 已由维护者调整工作区内容','code-comment'],['17','import os',''],['18','SERVICE_TOKEN = os.environ["CP_DEMO_TOKEN"]',''],['19','',''],['20','# 原 index 仍是旧内容','code-comment']];}
 else if(first){status='PRESENT';tone='amber';meaning='仍存在 · 原 index 未被副本修改';lines=[['16','# 服务配置（隔离演示夹具）','code-comment'],['17','SERVICE_NAME = "demo-service"',''],['18','SERVICE_TOKEN = "〈隔离测试值 · 已脱敏〉"','marked'],['19','',''],['20','# 这里只展示结构，不包含真实令牌','code-comment']];}
 else if(f.id==='CP-002'){status=state.source==='history'?'NOT_SCANNED':'PRESENT';tone=state.source==='history'?'gray':'amber';meaning=state.source==='history'?'该发现的历史来源未纳入本次示例核对':'结构匹配 · JSON不在自动改写白名单';lines=[['5','{',''],['6','  "service": "demo-database",',''],['7','  "dsn": "〈带认证字段的测试连接串 · 已脱敏〉"','marked'],['8','}',''],['9','// 展示片段，不是可执行配置','code-comment']];}
 else{status=state.source==='worktree'?'PRESENT':'NOT_SCANNED';tone=state.source==='worktree'?'blue':'gray';meaning=state.source==='worktree'?'结构候选存在 · 测试用途待人工复核':'该来源未执行 · 不能推断不存在';lines=[['1','〈PEM 私钥起始标记〉',''],['2','〈隔离测试材料 · 内容不展示〉','marked'],['3','〈PEM 私钥结束标记〉',''],['4','',''],['5','# 仅报告，不自动修复','code-comment']];}
 const notScanned=status==='NOT_SCANNED';return `<section class="card evidence-detail"><div class="detail-heading"><div><div class="title-line"><h2>${f.name}</h2>${pill(f.type,'gray')}</div><p>${f.id} · 指纹身份 fp_demo_${f.id.slice(-3)} · 展示标识，非真实计算值</p></div>${f.support?'<button class="btn primary slim" data-go="repair">查看副本验证 '+icon('arrow','i16')+'</button>':'<button class="btn slim" data-modal="suggestion">查看人工建议</button>'}</div>
 <div class="source-tabs" role="tablist" aria-label="证据来源">${[['worktree','工作区','folder'],['index','暂存区','branch'],['history','有界历史','clock']].map(([id,name,i])=>`<button role="tab" id="source-${id}" aria-controls="sourcePanel" aria-selected="${state.source===id}" tabindex="${state.source===id?0:-1}" class="${state.source===id?'active':''}" data-source="${id}">${icon(i,'i16')}${name}</button>`).join('')}</div>
 <div id="sourcePanel" role="tabpanel" aria-labelledby="source-${state.source}"><div class="source-info">${pill(status,tone)}<span>${meaning}</span></div>${notScanned?`<div class="story-caption" style="margin:0 22px 20px">${icon('info','i16')}<div><strong>没有该来源的执行证据。</strong><br>页面不会沿用其他来源的片段，也不会显示“已清洁”。</div></div>`:`<div class="code-window"><div class="code-toolbar"><span>${icon('code','i16')} ${f.path}</span><span>${state.source==='history'?'P0 未执行':'snapshot_'+state.source+'_demo'}</span></div><div class="code-block" aria-label="脱敏示例代码">${lines.map(([n,t,c])=>`<div class="code-line ${c==='marked'?'marked':''}"><span class="line-num">${n}</span><span class="${c==='marked'?'code-redacted':c}">${esc(t)}</span></div>`).join('')}</div></div><div class="evidence-note">${icon('lock','i16')} 展示片段已脱敏；原值不会通过按钮恢复显示。</div>`}</div>
 <div class="detail-bottom"><h3>判断依据</h3><div class="relation"><div class="relation-box"><span>来源与结构</span><strong>${first?'模块级直接赋值':f.id==='CP-002'?'JSON 对象 / service':'PEM 结构候选'}</strong></div>${icon('arrow','i16')}<div class="relation-box"><span>关联证据</span><strong>${first?'字段语义 + 格式匹配':f.id==='CP-002'?'连接串认证字段':'起止标记 + 结构信息'}</strong></div></div><div class="detail-note">${icon('info','i16')}<span>结构匹配支持候选研判，不能证明线上有效。来源版本独立；未执行、失败或过期记录不转为“未发现”。</span></div></div></section>`;}
function evidence(){return heading('EVIDENCE WORKBENCH','让每一条发现都有依据','先辨认来源与结构，再决定如何处置。',`<button class="btn" data-go="ai">${icon('spark','i16')} 查看 CP-001 研判示例</button>`)+`<div class="evidence-layout"><section class="card findings-panel"><div class="panel-search"><label class="search-field">${icon('search','i16')}<input id="findingSearch" aria-label="搜索示例发现" placeholder="搜索发现、文件或编号" value="${esc(state.search)}"></label></div><div class="filter-row" aria-label="发现筛选">${[['all','全部 3'],['action','需处置 2'],['review','待复核 1']].map(([v,t])=>`<button class="filter ${state.filter===v?'active':''}" data-filter="${v}" aria-pressed="${state.filter===v}">${t}</button>`).join('')}</div><div id="findingList">${findingItems()}</div><div class="panel-foot">演示中的完整格式值按暴露候选处理。<br>“测试用途”不等于自动忽略。</div></section><div id="detailMount">${evidenceDetail()}</div></div>${footer()}`;}
function repair(){const s=state.scenario;const title=s==='pass'?'指定副本验证通过':s==='fail'?'目标值仍有残留，验证未通过':'范围未完整覆盖，结论未知';const desc=s==='pass'?'适用义务在示例夹具中均通过。原仓库与原 index 没有被修改；历史未扫描。':s==='fail'?'同一测试值仍出现在副本的另一个文件；仅修改选中位置不足以通过范围验证。':'副本范围内有一个文件未完成扫描，缺少必要证据，不能显示通过。';const obligations=[['源快照绑定','修复对象与 index 导出内容一致'],['声明范围完整','verification_scope = 示例副本全部受支持文本'],['独立原值移除','原字节与受支持字面量解码比较'],['语法有效','静态检查，不导入业务模块'],['限定功能成立','仅自有夹具；缺少变量时明确失败'],['同规则复扫完成','规则版本与配置保持一致'],['没有新增受检问题','与修复前同范围结果比较'],['原件未写入','工作区与 index 保持原记录']];return heading('VERIFICATION CONTRACT','验证修复，而不是隐藏告警','CP-001示例 · 计划 RP-DEMO-01 · 来源为 index 快照 · 仅修改受控副本',`<button class="btn" data-go="evidence">${icon('evidence','i16')} 返回证据</button>${gotoBtn('report','查看报告',true)}`)+`<div class="scope-banner">${icon('info','i16')}<div>本页是预置验证场景。通过仅针对<strong>指定副本及声明范围</strong>，不代表原暂存区、历史或云端凭据已处置。</div></div><div class="repair-layout"><section class="card"><div class="verdict ${s==='pass'?'':s==='fail'?'fail':'unknown'}"><span class="verdict-icon">${icon(s==='pass'?'shield':s==='fail'?'alert':'info','i24')}</span><div><h2>${title}</h2><p>${desc}</p><span class="mono">COPY-DEMO-01 · scope_manifest_demo · ${s==='pass'?'PASS':s==='fail'?'FAIL':'UNKNOWN'}</span></div></div><div class="obligations">${obligations.map(([name,d],i)=>{let st='PASS',c='#749e8e',sym='check';if(s==='fail'&&i===2){st='FAIL';c='#b56d60';sym='close'}if(s==='unknown'&&[1,2,5,6].includes(i)){st='UNKNOWN';c='#ad8e55';sym='info'}return `<div class="obligation"><span class="checkmark" style="${st==='FAIL'?'background:#fff0eb;color:#b76e62':st==='UNKNOWN'?'background:#fff5df;color:#ab8a4e':''}">${icon(sym,'i16')}</span><div class="text">${name}<small>${d}</small></div><span class="mono" style="color:${c}">${st}</span></div>`}).join('')}</div><div class="demo-switch"><p>切换预置案例，检查界面如何表达失败与未知</p><div class="segmented" aria-label="切换模拟验证场景">${[['pass','通过示例'],['fail','同值残留'],['unknown','范围不完整']].map(([v,t])=>`<button data-scenario="${v}" class="${s===v?'active':''}" aria-pressed="${s===v}">${t}</button>`).join('')}</div></div></section><aside class="repair-aside"><section class="card"><div class="card-head"><div><h2>最小改写预览</h2><p>仅供阅读 · 脱敏差异不可直接应用</p></div>${icon('code','i16')}</div><div class="mini-diff"><div class="diff-file mono">src/config.py · 第 18 行</div><div class="diff-line minus">− SERVICE_TOKEN = "〈隔离测试值 · 已脱敏〉"</div><div class="diff-line plus">+ SERVICE_TOKEN = os.environ["CP_DEMO_TOKEN"]</div><p class="diff-description">无硬编码 fallback。示例已具备可用的 os 导入；环境变量缺失时明确失败。</p></div></section><section class="card"><div class="card-head"><div><h2>仍然需要处理</h2><p>与副本义务分开记录</p></div>${pill('未自动处置','amber')}</div><div class="residual"><div class="residual-row"><span>原 index</span>${pill('PRESENT','amber')}</div><div class="residual-row"><span>历史 / P0未执行</span>${pill('NOT_SCANNED','gray')}</div><div class="residual-row"><span>云端撤销 / 轮换</span>${pill('未验证','gray')}</div><div class="residual-warning">副本不会自动写回或暂存。P0未检查历史；凭据是否仍有效也无法从本页判断。</div></div></section></aside></div>${footer()}`;}
function aiAnswer(){if(state.scenario!=='pass')return `<strong>当前所选副本案例并没有通过验证。</strong><ol><li>${state.scenario==='fail'?'独立原值检查发现副本其他文件仍有同值残留，结论为 FAIL。':'声明范围内存在未完成检查的文件，必要义务为 UNKNOWN。'}<button class="citation-button" data-go="repair">义务记录 ↗</button></li><li>应先核对失败或缺失证据，不能把当前案例解释成已完成修复。</li><li>原 index 仍有出现记录，历史为NOT_SCANNED；切换意图不会改变状态。</li></ol>`;if(state.question.includes('下一步'))return `<strong>建议先核对证据，再由维护者分别处置。</strong><ol><li>审阅副本变更和全部验证义务，明确这是待应用副本。<button class="citation-button" data-go="repair">验证页 ↗</button></li><li>检查原 index 的内容，再自行决定更新暂存区；本原型不会执行。</li><li>保留历史未检查状态，由维护者独立确认后续排查与轮换。</li></ol>`;if(state.question.includes('有效'))return `<strong>无法从这些离线证据判断真实凭据是否有效。</strong><ol><li>结构匹配只能说明内容符合某种候选格式。</li><li>HMAC仅关联同值，不验证账号或权限。</li><li>撤销与轮换状态没有外部确认，应继续显示“未验证”。</li></ol>`;return `<strong>通过的是指定副本，仍待处理的是原来源。</strong><ol><li>RP-DEMO-01针对从 index 导出的副本；通过范围是该副本的声明文本集合。<button class="citation-button" data-go="repair">义务记录 ↗</button></li><li>原 index 仍保留该测试值，状态为 PRESENT。副本结果不能覆盖它。<button class="citation-button" data-source-link="index">E-INDEX ↗</button></li><li>P0未执行历史扫描，不能推断历史中是否出现；云端状态也未验证。<button class="citation-button" data-source-link="history">E-HISTORY ↗</button></li></ol>`;}
function ai(){const intents=[['为什么这项凭据仍需处置？','解释证据'],['下一步应该如何处理？','建议下一步'],['能证明这个凭据当前有效吗？','说明能力边界']];return heading('EVIDENCE-BOUND ASSISTANCE','AI 研判，有依据也有边界','固定演示上下文：CP-001 / index_snapshot_demo；不跟随其他发现串用证据。',pill('预置回复 · 未调用模型','blue'))+`<div class="ai-layout"><section class="card chat-panel"><div class="ai-header"><span class="ai-mark">${icon('spark')}</span><div><h2>密证研判助手</h2><p>CP-001 · 服务访问令牌 / RP-DEMO-01</p></div></div><div class="chat-log"><div class="chat-question">${esc(state.question)}</div><div class="assistant-label">${icon('spark','i16')} 基于示例证据的预置解释</div><div class="answer">${aiAnswer()}</div><div class="answer-boundary">这是固定意图的交互文案，不是模型推理结果。原型不发送数据、不触发文件或账号操作；选择意图不会改动验证状态。</div></div><div class="chat-input"><div class="ai-intents" aria-label="选择固定解释意图">${intents.map(([q,t])=>`<button class="btn ${state.question===q?'active':''}" data-question="${q}" aria-pressed="${state.question===q}">${t}</button>`).join('')}</div><p>固定ID获取一份解释；按钮仅切换展示视角，不发送问题。</p></div></section><aside class="card ai-side"><div class="card-head"><div><h2>可引用的证据</h2><p>解释必须能回到来源</p></div>${icon('evidence','i16')}</div><div class="fact-list"><div class="fact"><small>发现身份</small><strong>CP-001 · 服务访问令牌</strong></div><div class="fact"><small>index 原始状态</small><strong>PRESENT · 覆盖范围完整</strong></div><div class="fact"><small>副本验证</small><strong>${state.scenario==='pass'?'PASS · 仅指定副本':state.scenario==='fail'?'FAIL · 同值残留':'UNKNOWN · 范围不完整'}</strong></div><div class="fact"><small>历史状态</small><strong>NOT_SCANNED · P0未执行</strong></div><div class="fact"><small>未获得的事实</small><strong>凭据在线有效性、撤销完成情况</strong></div></div><div class="ai-boundary"><strong>可做：</strong>转述证据、解释边界、给出人工待办。<br><strong>不做：</strong>认证尝试、执行命令、写回仓库、无证据的安全承诺。</div></aside></div>${footer()}`;}
function report(){const st=state.scenario==='pass'?'PASS':state.scenario==='fail'?'FAIL':'UNKNOWN';return heading('REVIEWABLE REPORT','一份可以追溯的结论','把验证范围、来源状态和未完成事项一起交付。',`<button class="btn" data-go="repair">${icon('shield','i16')} 查看验证详情</button><button class="btn primary" data-modal="export">${icon('report','i16')} 模拟导出</button>`)+`<div class="report-layout"><article class="card report-paper"><div class="report-top"><div class="report-brand">密证 / CREDPROOF</div><span>方案原型 · 模拟报告</span></div><div class="eyebrow">VERIFICATION SUMMARY</div><h2>指定副本修复验证摘要</h2><p class="report-sub">报告标识 RPT-DEMO-01 · 计划 RP-DEMO-01<br>此预览随所选示例场景更新，不包含真实实验结果。</p><div class="report-callout" style="${st==='PASS'?'':st==='FAIL'?'background:#fff1ec;border-color:#cb8a75;color:#a36d60':'background:#fff7e6;border-color:#c7a75b;color:#9a8256'}"><strong>${st==='PASS'?'结论：指定副本适用义务通过。':st==='FAIL'?'结论：指定副本存在同值残留，未通过验证。':'结论：指定副本扫描范围不完整，无法判定通过。'}</strong><br>结论不覆盖原工作区、原index、范围外历史或云端账号。</div><div class="report-section"><h3>01 / 本次验证范围</h3><div class="report-rows"><div class="report-row"><span>输入来源</span><span>index_snapshot_demo</span></div><div class="report-row"><span>目标位置</span><span>src/config.py : 18</span></div><div class="report-row"><span>验证边界</span><span>声明副本全部受支持文本</span></div><div class="report-row"><span>功能验证</span><span>仅冻结的自有示例夹具</span></div><div class="report-row"><span>义务汇总</span>${pill(st,st==='PASS'?'green':st==='FAIL'?'red':'amber')}</div></div></div><div class="report-section"><h3>02 / 剩余风险与待办</h3><div class="report-rows"><div class="report-row"><span>原 index</span>${pill('仍存在','amber')}</div><div class="report-row"><span>有界历史</span><span>NOT_SCANNED · P0未执行</span></div><div class="report-row"><span>云端有效性 / 撤销</span><span>未验证，不作推断</span></div></div><p class="report-note">没有自动应用补丁、git add或改写历史。维护者仍需审阅变更，独立确认原来源处置和凭据轮换。</p></div><div class="report-foot"><span>脱敏展示 · 不含可应用补丁</span><span>仅为设计评审提供预览</span></div></article><aside class="card report-tools"><div class="card-head"><div><h2>报告内容</h2><p>信息完整，不把未知藏起来</p></div></div><div class="report-options">${['来源与快照标识','逐项验证状态与证据','声明范围及不完整项','原 index 风险 / 历史未检查','离线有效性的明确边界'].map(t=>`<div class="report-option">${icon('check','i16')}<span>${t}</span></div>`).join('')}<button class="btn primary" data-modal="export">查看模拟导出说明 ${icon('arrow','i16')}</button><button class="btn" data-modal="summary">预览对外摘要</button></div><div class="report-audit">实际产品将从保存的运行记录生成报告。<br>本页不创建文件、不生成伪造日志，也不会将预置状态冒充实验结果。</div></aside></div>${footer()}`;}
const names={overview:'总览',evidence:'证据工作台',repair:'修复验证',ai:'AI 研判',report:'报告'};
function render(shouldFocus=false){$('#main').innerHTML=({overview,evidence,repair,ai,report}[state.page])();$('#main').classList.remove('fade-in');void $('#main').offsetWidth;$('#main').classList.add('fade-in');$('#crumbPage').textContent=names[state.page];document.title=`${names[state.page]} · 密证 CredProof · 方案原型`;document.querySelectorAll('#nav button').forEach(b=>{const yes=b.dataset.page===state.page;b.classList.toggle('active',yes);if(yes)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(shouldFocus)$('#main').focus({preventScroll:true});}
function syncNavigation(){const small=window.matchMedia('(max-width:700px)').matches;$('#sidebar').inert=small&&!$('#sidebar').classList.contains('open');if(!small){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');$('#openNav').setAttribute('aria-expanded','false')}}
function closeNavigation(){const wasOpen=$('#sidebar').classList.contains('open');$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');$('#openNav').setAttribute('aria-expanded','false');syncNavigation();if(wasOpen)$('#openNav').focus()}
function go(page){state.page=page;closeNavigation();render(true);window.scrollTo({top:0,behavior:'auto'});}
let toastTimer;function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4300)}
let modalPrevious;const modalText={scope:['示例范围说明','<p>本原型预置了3条发现和1个副本验证计划，用于展示界面与状态契约。</p><p>工作区与index为P0来源；历史统一NOT_SCANNED，P0不执行历史扫描。此处没有读取任何本地仓库，页面数量也不是实测统计。</p>'],rotation:['撤销与轮换是独立事项','<p>离线检查只能解释内容和来源，不能证明凭据有效，也不能证明已撤销。</p><p>实际处置需要维护者在获得授权的系统中另行确认。本原型不会连接云端或尝试认证。</p>'],suggestion:['此类型仅提供人工建议','<p>首版自动改写限定为可确认的简单Python字符串直接赋值。</p><p>JSON连接串、私钥及未知加载语义只给出建议。不会把JSON中的 ${VAR} 字符串伪装成有效的环境变量读取。</p>'],export:['模拟导出 · 尚未生成文件','<p>正式产品将从已保存的运行与验证记录生成脱敏报告，并关联规则、版本和范围标识。</p><p>当前为离线交互原型，没有文件操作。可应用补丁与公开报告将分开存放，原始秘密不进入报告。</p>'],summary:['对外摘要预览','<p>本示例在明确来源和范围内展示了副本修复验证流程。副本状态、原index记录与历史未检查状态分别保存。</p><p>所有内容为预置模拟数据，不代表真实检测能力、实验成绩或在线凭据有效性。</p>']};
function openModal(key){const content=modalText[key]||modalText.scope;modalPrevious=document.activeElement;$('#modalTitle').textContent=content[0];$('#modalBody').innerHTML=content[1];$('#modalBackdrop').classList.remove('hidden');document.body.style.overflow='hidden';$('#modalClose').focus();}
function closeModal(){$('#modalBackdrop').classList.add('hidden');document.body.style.overflow='';if(modalPrevious&&document.contains(modalPrevious))modalPrevious.focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)go(b.dataset.page);else if(b.dataset.go)go(b.dataset.go);else if(b.dataset.finding){state.finding=b.dataset.finding;state.source=state.finding==='CP-001'?'index':'worktree';state.filter='all';state.search='';go('evidence')}else if(b.dataset.select){state.finding=b.dataset.select;$('#findingList').innerHTML=findingItems();$('#detailMount').innerHTML=evidenceDetail();document.querySelector(`[data-select="${state.finding}"]`)?.focus()}else if(b.dataset.source){state.source=b.dataset.source;$('#detailMount').innerHTML=evidenceDetail();$('#source-'+state.source).focus()}else if(b.dataset.filter){state.filter=b.dataset.filter;render();document.querySelector(`[data-filter="${state.filter}"]`).focus()}else if(b.dataset.scenario){state.scenario=b.dataset.scenario;render();document.querySelector(`[data-scenario="${state.scenario}"]`).focus();toast('已切换预置场景，未运行任何扫描或验证。')}else if(b.dataset.modal)openModal(b.dataset.modal);else if(b.dataset.question){state.question=b.dataset.question;render();toast('展示预置回复；没有调用模型或发送数据。')}else if(b.dataset.sourceLink){state.finding='CP-001';state.source=b.dataset.sourceLink;go('evidence')}});
document.addEventListener('input',e=>{if(e.target.id==='findingSearch'){state.search=e.target.value;$('#findingList').innerHTML=findingItems()}});
$('#resetDemo').addEventListener('click',()=>{Object.assign(state,{page:'overview',finding:'CP-001',source:'index',scenario:'pass',filter:'all',search:'',question:'为什么这项凭据仍需处置？'});closeNavigation();render(true);window.scrollTo(0,0);toast('演示已重置。没有读取或修改任何仓库。')});
$('#quickSearch').addEventListener('click',()=>{go('evidence');$('#findingSearch').focus()});$('#openNav').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#scrim').classList.add('open');$('#openNav').setAttribute('aria-expanded','true');syncNavigation();$('#closeNav').focus()});$('#closeNav').addEventListener('click',closeNavigation);$('#scrim').addEventListener('click',closeNavigation);$('#modalClose').addEventListener('click',closeModal);$('#modalDone').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modalBackdrop').classList.contains('hidden'))closeModal();else closeNavigation()}if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&$('#modalBackdrop').classList.contains('hidden')){e.preventDefault();go('evidence');$('#findingSearch').focus()}if(e.target.matches('[data-source]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const a=['worktree','index','history'];state.source=a[(a.indexOf(state.source)+(e.key==='ArrowRight'?1:2))%3];$('#detailMount').innerHTML=evidenceDetail();$('#source-'+state.source).focus()}if(e.key==='Tab'&&!$('#modalBackdrop').classList.contains('hidden')){const a=Array.from($('#modalBackdrop').querySelectorAll('button'));if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a[a.length-1].focus()}else if(!e.shiftKey&&document.activeElement===a[a.length-1]){e.preventDefault();a[0].focus()}}});
window.addEventListener('resize',syncNavigation);syncNavigation();render();
</script>
