[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credproof-safety"
version = "0.3.0.dev17"
description = "Controlled safety checks for authorised Python tools"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
project-tests = ["pytest>=8.0", "requests>=2.31"]
agent = ["qwen-agent==0.0.34", "ollama==0.6.0"]

[project.scripts]
credproof-safety = "credproof_safety.cli:main"

[tool.setuptools.packages.find]
include = ["credproof*", "credproof_safety*", "agent_pilot*"]

# The single-page workbench is part of the installed candidate.  The source
# checkout can serve these files from agent_pilot/ui, but a clean wheel must
# carry them explicitly because the directory is intentionally not a Python
# package.  Reviewed synthetic fixtures remain package data for the same
# reason; no model weights or local runtime files are included.
[tool.setuptools.package-data]
agent_pilot = [
  "ui/*.html",
  "ui/*.js",
  "ui/*.css",
  "ui/*.md",
  "fixtures/**",
  "holdout-v1/**",
  "isolation-tests/**",
]
